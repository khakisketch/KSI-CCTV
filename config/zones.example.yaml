# =============================================================================
# KSI-CCTV 구역 침입(Zone Intrusion) 설정 예시 템플릿
# =============================================================================
#
# 이 파일은 예시(template)입니다. 실제 운영에는 직접 사용하지 마세요.
#
# 사용 방법:
#   1. 이 파일을 복사하거나 config/camera_profiles.yaml 의 각 카메라 zones 섹션에
#      아래 형식을 참조하여 좌표를 직접 입력합니다.
#   2. 반드시 실제 카메라 영상(해상도 기준)에서 좌표를 측정하세요.
#      좌표는 픽셀 단위(px), 원점은 영상 좌측 상단(0,0)입니다.
#   3. 측정 도구 예시:
#      - python3 scripts/create_sample_video.py 로 테스트 영상 생성 후 VLC로 좌표 확인
#      - OpenCV 마우스 콜백으로 좌표 클릭 획득
#      - 설치 후: python3 -c "import cv2; ..."
#   4. 좌표 확정 후 config/camera_profiles.yaml 의 해당 카메라 zones 섹션에 기입하고
#      config/event_policies.yaml 의 restricted_area 정책을 enabled: true 로 전환합니다.
#
# 주의:
#   - 카메라 해상도(예: 1920x1080)가 바뀌면 좌표도 새로 측정해야 합니다.
#   - 카메라 위치/각도가 달라지면 재캘리브레이션 필요합니다.
#   - 좌표 미입력(points: []) 상태로 정책을 활성화해도 zone_missing 오류만 발생합니다.
#
# =============================================================================
# 좌표 형식
# =============================================================================
#
# 형식: [x, y]  단위: 픽셀(px)  원점: 좌측 상단
#
# polygon (다각형 구역) — 최소 3점:
#   point[0]: 좌측 상단 꼭짓점
#   point[1]: 우측 상단 꼭짓점
#   point[2]: 우측 하단 꼭짓점
#   point[3]: 좌측 하단 꼭짓점
#   ... (꼭짓점이 더 많으면 계속 추가)
#
# 예시 해상도: 1920 × 1080 (Full HD)
#   - 영상 전체:   [0,0] → [1920,0] → [1920,1080] → [0,1080]
#   - 좌상단 1/4:  [0,0] → [960,0]  → [960,540]   → [0,540]
#   - 중앙 구역:   [640,360] → [1280,360] → [1280,720] → [640,720]
#
# =============================================================================

# -----------------------------------------------------------------------------
# 예시 1. 건설현장 카메라 — 위험구역(중장비 이동 경로) 단일 직사각 polygon
# -----------------------------------------------------------------------------
# 카메라 해상도: 1920 × 1080
# 구역: 영상 하단 중앙 — 중장비 진입로 (픽셀 단위로 현장에서 실측 필요)
# 아래 좌표는 예시일 뿐입니다. 실 카메라 영상에서 반드시 재측정하세요.
example_construction_cam:
  zones:
    restricted:
      type: polygon
      label: "중장비 이동경로 (진입 금지)"
      description: "지게차·굴착기 이동 경로. 실 카메라 1920x1080 기준 좌표로 교체 필요."
      # ↓↓↓ 실 카메라 해상도 기준으로 아래 좌표를 측정·교체하세요 ↓↓↓
      points:
        - [600, 700]    # 좌측 상단 꼭짓점 — 실측 후 교체
        - [1320, 700]   # 우측 상단 꼭짓점 — 실측 후 교체
        - [1320, 1080]  # 우측 하단 꼭짓점 — 실측 후 교체
        - [600, 1080]   # 좌측 하단 꼭짓점 — 실측 후 교체
      # ↑↑↑ 좌표 측정 완료 후 config/camera_profiles.yaml에 복사·적용 ↑↑↑

    # 두 번째 구역 예시: 전기 패널 구역
    electric_panel:
      type: polygon
      label: "전기 패널실 (접근 금지)"
      description: "고전압 전기 패널. 실 카메라 1920x1080 기준 좌표로 교체 필요."
      points:
        - [50, 200]    # 좌측 상단 — 실측 후 교체
        - [350, 200]   # 우측 상단 — 실측 후 교체
        - [350, 500]   # 우측 하단 — 실측 후 교체
        - [50, 500]    # 좌측 하단 — 실측 후 교체


# -----------------------------------------------------------------------------
# 예시 2. 공장 카메라 — 제한구역 L자형 polygon (6점 예시)
# -----------------------------------------------------------------------------
# 카메라 해상도: 1280 × 720 (HD)
# 구역: 프레스 기계 주변 L자형 위험 구역
# 아래 좌표는 예시일 뿐입니다. 실 카메라 영상에서 반드시 재측정하세요.
example_factory_cam:
  zones:
    press_machine_area:
      type: polygon
      label: "프레스 기계 위험구역"
      description: "프레스 동작 반경. 작업자 진입 시 즉시 알람. 1280x720 기준 — 실측 필요."
      # 6점 L자형 — 실 카메라 해상도 기준으로 모두 교체하세요
      points:
        - [200, 100]   # 꼭짓점 1 — 실측 후 교체
        - [700, 100]   # 꼭짓점 2 — 실측 후 교체
        - [700, 400]   # 꼭짓점 3 — 실측 후 교체
        - [500, 400]   # 꼭짓점 4 (L자 꺾임) — 실측 후 교체
        - [500, 600]   # 꼭짓점 5 — 실측 후 교체
        - [200, 600]   # 꼭짓점 6 — 실측 후 교체


# -----------------------------------------------------------------------------
# 예시 3. 주차장 카메라 — 차량 진입 금지 구역 (보행자 전용 통로)
# -----------------------------------------------------------------------------
# 카메라 해상도: 1920 × 1080
# 아래 좌표는 예시일 뿐입니다. 실 카메라 영상에서 반드시 재측정하세요.
example_parking_cam:
  zones:
    pedestrian_only:
      type: polygon
      label: "보행자 전용 통로 (차량 금지)"
      description: "주차장 내 보행자 통로. person 진입은 무시, vehicle 진입 시 알람. 실측 필요."
      # 아래 좌표는 예시입니다 — 실 카메라 해상도 기준으로 교체하세요
      points:
        - [760, 0]     # 통로 좌측 상단 — 실측 후 교체
        - [1160, 0]    # 통로 우측 상단 — 실측 후 교체
        - [1160, 1080] # 통로 우측 하단 — 실측 후 교체
        - [760, 1080]  # 통로 좌측 하단 — 실측 후 교체


# =============================================================================
# 적용 방법 요약
# =============================================================================
#
# [1단계] 카메라 영상에서 구역 좌표 측정
#   - VLC → Tools → Media Information → Statistics 에서 해상도 확인
#   - OpenCV 예시 (좌표 클릭 획득):
#       import cv2
#       img = cv2.imread("frame.jpg")
#       def on_click(event, x, y, flags, param):
#           if event == cv2.EVENT_LBUTTONDOWN:
#               print(f"  - [{x}, {y}]")
#       cv2.namedWindow("zone")
#       cv2.setMouseCallback("zone", on_click)
#       cv2.imshow("zone", img)
#       cv2.waitKey(0)
#
# [2단계] config/camera_profiles.yaml 의 해당 카메라 zones 섹션에 좌표 기입
#   cameras:
#     cam_002:
#       zones:
#         restricted:
#           type: polygon
#           points:
#             - [측정된x1, 측정된y1]
#             - [측정된x2, 측정된y2]
#             ...
#
# [3단계] config/event_policies.yaml 에서 restricted_area 활성화
#   restricted_area:
#     enabled: true   # false → true 로 변경
#     ...
#     rule:
#       type: zone_intrusion
#       zone_id: restricted   # 위 zones 키와 일치해야 함
#
# [4단계] 파이프라인 재기동 후 로그에서 zone_intrusion 이벤트 확인
#
# =============================================================================
