# KSI-CCTV model profiles
# Phase 1 draft. Only general_yolo is currently expected to exist.

models:
  general_yolo:
    enabled: true
    type: yolo_onnx
    source: built_in
    model_path: "./models/yolo26.onnx"
    class_profile: coco
    classes: null
    input_size: [640, 640]
    conf_threshold: 0.25
    iou_threshold: 0.45
    postprocess_mode: auto
    device: cuda
    fp16: true
    description: "COCO pretrained model for person, vehicle, and general objects."

  ppe_yolo:
    enabled: true
    type: yolo_onnx
    source: pre_trained
    model_path: "./models/yolo26_ppe.onnx"
    class_profile: safety_custom
    # classes는 ONNX 모델에 내장된 names 메타데이터에서 자동 인식한다(null 권장).
    # 실측 메타데이터: {0: Hardhat, 1: NO-Hardhat} — 2 classes, output [1,6,8400]. vest 미지원.
    # 아래 class_map이 모델 클래스명 → KSI-CCTV 표준명으로 변환한다.
    classes: null
    input_size: [640, 640]
    conf_threshold: 0.30
    iou_threshold: 0.45
    postprocess_mode: auto
    device: cuda
    fp16: true
    description: "Pre-trained hard-hat model (keremberke/yolov8n-hard-hat-detection). 2-class Hardhat/NO-Hardhat → helmet/no_helmet. 조끼는 미지원(커스텀 모델 필요)."
    # 모델 실제 클래스명 → KSI-CCTV 표준 클래스명
    class_map:
      Hardhat: helmet
      NO-Hardhat: no_helmet

  fire_smoke_yolo:
    enabled: true
    type: yolo_onnx
    source: pre_trained
    model_path: "./models/yolo26_fire_smoke.onnx"
    class_profile: custom
    # classes는 ONNX 모델에 내장된 names 메타데이터에서 자동 인식한다(null 권장).
    # 실측 메타데이터: {0: fire-smoke, 1: fog, 2: sol, 3: fire, 4: factory-smoke}
    #   — 5 classes, output [1,9,8400]. (touati-kamel/yolov8s-forest-fire-detection)
    # 아래 class_map이 fire-smoke/fire → fire, factory-smoke → smoke로 변환(fog/sol은 미매핑).
    classes: null
    input_size: [640, 640]
    conf_threshold: 0.20
    iou_threshold: 0.40
    postprocess_mode: auto
    device: cuda
    fp16: true
    description: "Pre-trained forest-fire model (touati-kamel/yolov8s-forest-fire-detection), 5-class. fire-smoke/fire → fire, factory-smoke → smoke. fog/sol은 무관(미매핑)."
    # 모델 실제 클래스명 → KSI-CCTV 표준 클래스명 (fog, sol은 의도적으로 미매핑 = 어떤 정책도 트리거 안 함)
    class_map:
      fire-smoke: fire
      fire: fire
      factory-smoke: smoke

  pose_fall_model:
    enabled: false
    type: future_pose_or_yolo
    source: built_in
    model_path: "./models/pose_fall.onnx"
    classes: [person, fall]
    description: "Future pose/fall model. Disabled until implemented."

vlm:
  enabled: true
  provider: ollama
  model_name: "qwen3-vl:latest"
  base_url: "http://localhost:11434"
  timeout_sec: 60
  max_retries: 2
  cooldown_sec: 60
  max_concurrent: 2
