# KSI-CCTV model profiles
# Enabled profiles are the current Appliance model contract. Model assets are baked into signed release images.

models:
  general_yolo:
    enabled: true
    type: yolo_onnx
    source: built_in
    model_path: "./models/yolo26.onnx"
    class_profile: coco
    classes: null
    input_size: [640, 640]
    conf_threshold: 0.25
    iou_threshold: 0.45
    # 명시 지정(heuristic 비의존) — yolo26은 end-to-end 출력 [1,300,6](NMS 불필요).
    postprocess_mode: nms_free
    device: auto   # auto=가용 가속 자동선택(DGX=CUDA, 그 외 DirectML/CoreML/QNN/CPU 폴백)
    fp16: true
    description: "COCO pretrained model for person, vehicle, and general objects."

  ppe_yolo:
    enabled: true
    type: yolo_onnx
    source: pre_trained
    model_path: "./models/yolo26_ppe.onnx"
    class_profile: safety_custom
    # classes는 ONNX 모델에 내장된 names 메타데이터에서 자동 인식한다(null 권장).
    # 실측 메타데이터(Hansung-Cho/yolov8-ppe-detection, 10-class, output [1,14,8400]):
    #   {0:Hardhat,1:Mask,2:NO-Hardhat,3:NO-Mask,4:NO-Safety Vest,5:Person,6:Safety Cone,7:Safety Vest,8:machinery,9:vehicle}
    # 아래 class_map이 모델 클래스명 → KSI-CCTV 표준명으로 변환한다(helmet+vest 모두 지원).
    classes: null
    input_size: [640, 640]
    conf_threshold: 0.30
    iou_threshold: 0.45
    # 명시 지정 — yolov8 raw 출력 [batch,14,anchors](NMS 필요). heuristic 오판 방지.
    postprocess_mode: nms
    device: auto   # auto=가용 가속 자동선택(DGX=CUDA, 그 외 DirectML/CoreML/QNN/CPU 폴백)
    fp16: true
    description: "공개 pretrained PPE 모델(Hansung-Cho/yolov8-ppe-detection, 10-class). helmet+vest 지원(no_helmet/no_vest 탐지). mAP@50 0.744. ⚠️가중치 AGPL-3.0 — 상용 배포 시 라이선스 검토(docs/model-sourcing.md)."
    # 모델 실제 클래스명 → KSI-CCTV 표준 클래스명 (Mask/NO-Mask/Safety Cone/machinery/vehicle는 표준 외 → 미매핑)
    class_map:
      Hardhat: helmet
      NO-Hardhat: no_helmet
      Safety Vest: vest
      NO-Safety Vest: no_vest
      Person: person

  fire_smoke_yolo:
    enabled: true
    type: yolo_onnx
    source: pre_trained
    model_path: "./models/yolo26_fire_smoke.onnx"
    class_profile: custom
    # classes는 ONNX 모델에 내장된 names 메타데이터에서 자동 인식한다(null 권장).
    # 실측 메타데이터(Flare Guard YOLO11n, output [1,6,8400]): {0: Fire, 1: Smoke} — 일반 장면.
    # 아래 class_map이 Fire → fire, Smoke → smoke로 변환.
    classes: null
    input_size: [640, 640]
    conf_threshold: 0.25
    iou_threshold: 0.45
    # 명시 지정 — yolo11 raw 출력 [batch,6,anchors](NMS 필요). 6채널이라 heuristic 오판 소지 → 고정.
    postprocess_mode: nms
    device: auto   # auto=가용 가속 자동선택(DGX=CUDA, 그 외 DirectML/CoreML/QNN/CPU 폴백)
    fp16: true
    description: "공개 pretrained 화재/연기 모델(Flare Guard YOLO11n, fire+smoke). 일반 장면(forest-only 아님). mAP@50 0.770. ⚠️가중치 AGPL-3.0/LICENSE 부재 — 상용 배포 시 검토(docs/model-sourcing.md)."
    # 모델 실제 클래스명 → KSI-CCTV 표준 클래스명
    class_map:
      Fire: fire
      Smoke: smoke

  # open-vocab(YOLO-World) — 학습 없이 classes의 텍스트 프롬프트로 즉시 탐지. 비활성 기본.
  # 활성화: enabled:true + classes에 원하는 객체(한글/영문) 나열 → 재학습 없이 탐지.
  # ⚠️ ultralytics+clip 필요(pip; clip은 ultralytics가 자동 설치). 가중치 yolov8s-world.pt는
  #   첫 사용 시 자동 다운로드(GPLv3 — 상용 배포 시 라이선스 검토, docs/roadmap-capability.md).
  #   실시간성은 GPU 의존(CPU는 초 단위) — 저사양은 skip_frames 상향/트리거 호출 권장.
  open_vocab_yolo:
    enabled: false
    type: open_vocab
    source: pre_trained
    model_path: "yolov8s-world.pt"
    # 프롬프트=출력 클래스명(=KSI 표준명, class_adapter는 identity). 예시(현장에 맞게 교체):
    classes: [person, helmet, "no helmet", forklift, "fire extinguisher", fire, smoke]
    conf_threshold: 0.05
    iou_threshold: 0.45
    device: auto
    description: "Open-vocab YOLO-World — 학습 없이 텍스트 프롬프트로 임의 객체 탐지(검증: CPU 실추론 PASS)."

  pose_onnx:
    enabled: false
    type: pose_onnx
    source: built_in
    model_path: "./models/pose.onnx"
    input_size: [640, 640]
    keypoint_count: 17
    confidence_threshold: 0.25
    output_layout: bcn
    device: auto
    description: "Feature-gated YOLO-pose ONNX contract."

  stgcn_onnx:
    enabled: false
    type: stgcn_onnx
    source: built_in
    model_path: "./models/stgcn.onnx"
    class_names: [normal, fall, fight]
    keypoint_count: 17
    sequence_length: 30
    device: auto
    description: "Feature-gated ST-GCN ONNX [1,C,T,V,M] action contract."
