# Camera-level detection profile draft.
# In Phase 1 this is documentation/config foundation only.

cameras:
  # 기본(예시) 카메라 — 범용 CCTV 프로파일. 어느 현장에나 바로 동작(사람·쓰러짐·화재·연기·혼잡).
  # 건설/공장 등 특화가 필요하면 domain을 construction/factory/parking/school로 바꾼다.
  cam_001:
    domain: general
    enabled: true
    enabled_events:
      - person_detected
      - fall
      - fire
      - smoke
      - crowding
    models:
      - general_yolo
      - fire_smoke_yolo
    zones: {}

  cam_002:
    domain: construction
    enabled: false
    enabled_events:
      - no_helmet
      - no_vest
      - fire
      - smoke
      - restricted_area
    models:
      - general_yolo
      - ppe_yolo
      - fire_smoke_yolo
    zones:
      restricted:
        type: polygon
        points: []

  cam_003:
    domain: school
    enabled: false
    enabled_events:
      - person_detected
      - fall
      - fight
      - crowding
    models:
      - general_yolo
    zones: {}

domains:
  general:
    label: "범용 CCTV"
    default_events: [person_detected, fall, fire, smoke, crowding]
    default_models: [general_yolo, fire_smoke_yolo]

  construction:
    label: "건설현장"
    default_events: [person_detected, no_helmet, no_vest, fire, smoke, fall]
    default_models: [general_yolo, ppe_yolo, fire_smoke_yolo]

  school:
    label: "학교"
    default_events: [person_detected, fall, fight, crowding]
    default_models: [general_yolo]

  factory:
    label: "공장"
    default_events: [person_detected, no_helmet, restricted_area, fire, smoke]
    default_models: [general_yolo, ppe_yolo, fire_smoke_yolo]

  parking:
    label: "주차장/빌딩"
    default_events: [person_detected, restricted_area, fire, smoke]
    default_models: [general_yolo, fire_smoke_yolo]
