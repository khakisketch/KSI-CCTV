# 기본 설정
app:
  name: "KSI-CCTV"
  version: "0.1.0"
  # 범용 CCTV 운영 기본값 — 디버그 OFF·INFO 로그(상시 운영 시 DEBUG는 과다·디스크 낭비).
  # 개발 중 상세 로그가 필요하면 KSI_CCTV_LOG_LEVEL=DEBUG 환경변수로 일시 상향.
  debug: false
  log_level: "INFO"
  log_dir: "./logs"
  timezone: "Asia/Seoul"

# CCTV 채널 설정
# 카메라 인벤토리: config/cameras.json(legacy, 읽기전용 import) → managed 정본은
# config/cameras/ + CameraRepository로 이관 중(U2). 여기 값은 타이밍 임계값만 둔다.
cameras:
  default_fps: 30
  max_channels: 16
  reconnect_interval_sec: 5
  timeout_sec: 10
  # 마지막 프레임 수신 후 이 시간(초) 초과 시 stale(프레임 지연)로 판정 → /health unhealthy.
  # 네트워크/카메라 fps에 맞춰 조정(저fps 카메라는 상향). 이전엔 코드 고정(30s)이라 조정 불가였음.
  stale_threshold_sec: 30
  # 운영 상태 이벤트: 10초부터 영상 지연, 30초부터 단절로 전이한다.
  health_stale_after_sec: 10
  disconnect_after_sec: 30
  tamper_duration_sec: 5
  tamper_recovery_sec: 3

# 모델 설정
# 런타임 SSOT는 config/model_profiles.yaml이다(MultiModelRegistry가 로드).
# 아래 models.yolo 값은 단일-detector fallback 참조용이며 실행 시에는 profile 값이 우선한다.
models:
  yolo:
    model_path: "./models/yolo26.onnx"
    input_size: [640, 640]
    # 범용 CCTV 기본 신뢰도 — 0.25는 다양한 현장에서 부분/가림 박스 오탐이 많아 0.30으로 상향.
    # (정밀 게이트는 config/event_policies.yaml의 이벤트별 min_confidence가 추가로 담당)
    conf_threshold: 0.30
    iou_threshold: 0.45
    postprocess_mode: "nms_free"  # auto|nms|nms_free — yolo26은 end-to-end NMS-free [1,300,6]
    class_profile: "coco"  # coco(pretrained yolo26n) 또는 safety_custom(커스텀 안전 모델)
    # YOLO26은 end-to-end NMS-free 구조로 추론 속도가 더 빠름
    # Ultralytics: yolo export model=yolo26n.pt format=onnx imgsz=640 half=True device=0
    # safety_custom 모델을 사용할 때만 classes를 모델 학습 순서와 동일하게 지정하세요.
    # classes: [person, helmet, vest, fire, smoke, fall]
  vlm:
    # VLM runtime/provider SSOT. This is intentionally not a detector profile in model_profiles.yaml.
    provider: "ollama"
    model_name: "qwen3-vl:latest"
    base_url: "http://127.0.0.1:11434"
    # First offline Appliance release has no signed Ollama/model artifact. Enable only in a separately qualified release.
    enabled: false
    runtime_qualified: false
    model_digest: ""
    timeout_sec: 60
    max_retries: 2
    cooldown_sec: 60
    max_concurrent: 2
    allowed_hosts: []
    max_frames: 3
    max_dimension: 640
    jpeg_quality: 80
    max_total_bytes: 3145728
    frame_window_sec: 5
    queue_soft_limit: 8
    queue_hard_limit: 16
    prompt_template: "./config/prompts/construction.yaml"

# 감지 설정
# target_classes / vlm_trigger_classes는 legacy 경로 전용이다.
# policy-mode에서는 config/event_policies.yaml의 trigger.models/classes가 SSOT다.
detection:
  # YOLO 필터링 프레임 간격 (1 = 모든 프레임, 5 = 5프레임마다)
  skip_frames: 5
  # 알람 발송 최소 간격 (초)
  alert_cooldown_sec: 30
  # 관심 클래스 (쉼표 구분)
  # COCO pretrained 모델은 fire/smoke/fall/helmet/vest 직접 탐지가 어렵습니다.
  # 해당 이벤트는 safety_custom YOLO 모델 또는 VLM에서 보강하세요.
  target_classes: "person,fire,smoke,fall"
  # VLM 트리거 클래스 — 기본 비활성(빈 문자열).
  # 정책 엔진(config/event_policies.yaml)에서 사건 후보에만 VLM을 예약하므로,
  # legacy 경로로 person 감지 프레임을 무조건 VLM 후보로 보내지 않는다.
  # people이 정상 통행할 때마다 VLM 호출이 폭주하고 무의미한 'vlm_analysis_candidate'
  # 관찰이 쌓이는 것을 방지한다. VLM 사건 검증은 정책 vlm: always/on_high_confidence로 동작.
  vlm_trigger_classes: ""
  vlm_cooldown_sec: 60
  # 참고: 안전모/조끼 판정은 class_profile=safety_custom 모델 또는 VLM에서 수행합니다.

# 카메라별 ByteTrack 실행 설정. 사건별 class/confidence/cooldown은
# config/event_policies.yaml이 SSOT이며 여기에는 tracker 자체 설정만 둔다.
tracking:
  track_high_thresh: 0.35
  track_low_thresh: 0.10
  new_track_thresh: 0.40
  track_buffer: 30
  match_thresh: 0.80
  trajectory_size: 120
  stale_history_sec: 300

# Pose/ST-GCN behavior inference is opt-in. Missing disabled assets are nonfatal.
behavior:
  enabled: false
  iou_threshold: 0.50
  inference_stride: 5
  stale_after_sec: 10
  max_tracks_per_camera: 100

# 디바이스 설정
device:
  # 실행 가속기(Execution Provider) 선택. auto(권장)=가용한 가장 빠른 가속 자동선택.
  # auto | cuda | tensorrt | directml(Windows 범용 GPU) | coreml(macOS) | qnn(Windows ARM64 NPU) | cpu
  # 설치된 onnxruntime 패키지가 노출하는 provider만 사용되며 항상 CPU로 폴백한다(멀티-OS 설치형).
  primary: "auto"
  # GPU 할당 비율 (0.8 = 80%)
  gpu_memory_fraction: 0.8
  # FP16 추론
  fp16: true

# 알람 설정
alerts:
  enabled: true
  # 로그 파일 경로
  log_file: "./logs/alerts.log"
  # 콘솔 출력
  console_output: true
  # 이미지 캡처 저장
  save_images: true
  image_dir: "./data/captures"
  # 이미지 보관 기간 (일)
  image_retention_days: 30
  # 저장 evidence와 snapshot의 얼굴 블러링. 인증된 live HLS는 원본 관제 스트림이다.
  blur_faces: true
  face_blur_strength: 35
  # 캡처 이미지 암호화 저장(개인정보 보호). true이면 KSI_CCTV_CAPTURE_KEY 환경변수에
  # Fernet 키가 있어야 하며 .jpg.enc로 저장된다. 대시보드 갤러리는 동일 키로 복호화 표시.
  # 운영 기본값은 암호화. KSI_CCTV_CAPTURE_KEY(Fernet)가 없으면 캡처 저장을 켠
  # 데몬은 fail-closed로 기동하지 않는다. 캡처가 전혀 필요 없는 현장은 save_images:false를 명시.
  encrypt_images: true
  # 알람 로그 로테이션
  log_max_bytes: 10485760
  log_backup_count: 5

# 메타데이터 전용 관측 저장. 원본 영상/프레임은 이 DB에 저장하지 않는다.
storage:
  observations_db: "./data/observations.db"
  observation_retention_days: 30
  observation_max_buckets_per_camera: 43200  # 30일 × 24시간 × 60분
  # Event lifecycle/history는 observations DB와 동일한 SQLite 파일에 저장한다.
  # 운영상 분리가 필요하면 KSI_CCTV_EVENTS_DB 또는 events_db로 별도 파일을 지정한다.
  events_db: "./data/observations.db"
  event_retention_days: 30

# RTSP 설정
rtsp:
  # FFmpeg 사용 여부 (성능 우선시)
  use_ffmpeg: true
  # 버퍼 크기 (초)
  buffer_size_sec: 2
  # 해상도 (0 = 원본)
  width: 0
  height: 0
  # 프레임 드롭 허용
  allow_frame_drop: true
