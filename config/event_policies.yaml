# Event policies for KSI-CCTV.
# Policies map model detections to safety events.

profiles:
  construction:
    policies:
      person_detected:
        enabled: true
        trigger:
          models: [general_yolo]
          classes: [person]
          min_confidence: 0.25
        rule:
          type: direct_detection
        vlm: never
        alert_level: low
        cooldown_sec: 60
        description: "사람 감지"

      no_helmet:
        enabled: true
        # ppe_yolo가 NO-Hardhat(=no_helmet)을 직접 탐지하므로 person+helmet overlap 룰이 아니라
        # direct_detection을 사용한다. (이 모델은 person 클래스를 출력하지 않아 overlap 룰은 영구 미발생)
        trigger:
          models: [ppe_yolo]
          classes: [no_helmet]
          min_confidence: 0.30
        rule:
          type: direct_detection
        vlm: on_ambiguous
        alert_level: medium
        cooldown_sec: 30
        description: "안전모 미착용"

      no_vest:
        # 현재 ppe_yolo 모델(Hardhat/NO-Hardhat 2클래스)은 조끼를 탐지하지 못하므로 비활성화.
        # vest/no_vest 클래스를 가진 커스텀 safety 모델 도입(로드맵 Track B) 후 enabled: true로 전환.
        # 그 전까지 조끼 미착용은 person_detected → VLM 분석 경로로만 설명된다.
        enabled: false
        trigger:
          models: [ppe_yolo]
          classes: [no_vest]
          min_confidence: 0.30
        rule:
          type: direct_detection
        vlm: on_ambiguous
        alert_level: medium
        cooldown_sec: 30
        description: "안전조끼 미착용 (커스텀 모델 필요 — 현재 비활성)"

      fire:
        enabled: true
        trigger:
          models: [fire_smoke_yolo]
          classes: [fire]
          min_confidence: 0.40
        rule:
          type: direct_detection
        vlm: always
        alert_level: critical
        cooldown_sec: 15
        description: "화재 감지"

      smoke:
        enabled: true
        # fire_smoke_yolo의 factory-smoke 클래스를 smoke로 매핑(model_profiles.yaml class_map) → 직접 탐지.
        # (이전에는 smoke 클래스가 없는 general_yolo(COCO)로 라우팅되어 영구 미발생하는 dead config였음)
        trigger:
          models: [fire_smoke_yolo]
          classes: [smoke]
          min_confidence: 0.30
        rule:
          type: direct_detection
        vlm: on_high_confidence
        alert_level: high
        cooldown_sec: 20
        description: "연기 감지 (fire_smoke_yolo의 factory-smoke → smoke 매핑)"

      fall:
        enabled: true
        trigger:
          models: [general_yolo]
          classes: [person]
          # trigger.min_confidence를 명시해 저신뢰 person 박스를 coarse 게이트에서 차단한다.
          # rule에 min_confidence가 없으면 이 값을 상속한다(SSOT — 한 곳에만 명시).
          min_confidence: 0.25
        rule:
          type: pose_anomaly
          aspect_ratio_threshold: 2.0
          # temporal 파라미터 — 이전 프레임 대비 높이/중심 변화로 쓰러짐 보강 판단
          height_drop_ratio: 0.45
          cy_drop_ratio: 0.35
        vlm: always
        alert_level: high
        cooldown_sec: 20
        description: "쓰러짐 의심"

      restricted_area:
        enabled: false
        trigger:
          models: [general_yolo]
          classes: [person]
        rule:
          type: zone_intrusion
          zone_id: restricted
        vlm: never
        alert_level: medium
        cooldown_sec: 30
        description: "제한구역 침입"

  school:
    policies:
      person_detected:
        enabled: true
        trigger:
          models: [general_yolo]
          classes: [person]
          min_confidence: 0.25
        rule:
          type: direct_detection
        vlm: never
        alert_level: low
        cooldown_sec: 60
        description: "사람 감지"

      fall:
        enabled: true
        trigger:
          models: [general_yolo]
          classes: [person]
          min_confidence: 0.25
        rule:
          type: pose_anomaly
          aspect_ratio_threshold: 2.0
          height_drop_ratio: 0.45
          cy_drop_ratio: 0.35
        vlm: always
        alert_level: high
        cooldown_sec: 20
        description: "쓰러짐 의심"

      fight:
        enabled: true
        trigger:
          models: [general_yolo]
          classes: [person]
          min_confidence: 0.25
        rule:
          type: person_proximity
          min_persons: 2
          max_distance_px: 50
        vlm: always
        alert_level: critical
        cooldown_sec: 20
        description: "싸움/폭력 의심"

      crowding:
        enabled: true
        trigger:
          models: [general_yolo]
          classes: [person]
          min_confidence: 0.25
        rule:
          type: count_threshold
          min_count: 20
        vlm: never
        alert_level: low
        cooldown_sec: 60
        description: "혼잡 감지"
