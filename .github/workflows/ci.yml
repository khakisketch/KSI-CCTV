name: CI

# KSI-CCTV 지속적 통합 — PR/푸시마다 lint·단위테스트 자동 회귀.
# 실 ONNX 모델/샘플 영상은 저장소에 없으므로(.gitignore) test_e2e_real 등 실자산
# 의존 테스트는 _HAS_REAL_ASSETS 가드로 자동 skip된다(설계상 정상).

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff lint (blocking)
        run: ruff check src/ tests/ scripts/

      - name: Pytest + coverage gate (blocking, cache-clean)
        # scripts/test.sh와 동일 게이트 — 커버리지 50% 미만이면 실패(가짜 green 방지).
        run: >
          python -B -m pytest tests/ -q -p no:cacheprovider
          --cov=src --cov-report=term-missing --cov-fail-under=50

      - name: Mypy (advisory)
        run: mypy src/ || echo "mypy 타입 경고 — 점진 해소 대상(게이트 차단 아님)"
