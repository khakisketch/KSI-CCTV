# 가상 CCTV 랩 전용 MediaMTX 설정. 모든 경로는 publisher만 기록할 수 있다.
logLevel: warn
rtspTransports: [tcp]
hlsAddress: :8888
api: true
apiAddress: :9997
pathDefaults:
  overridePublisher: false
authInternalUsers:
  # API is bound to localhost by default; this enables the local status URL without credentials.
  - user: any
    permissions:
      - action: publish
      - action: read
      - action: api
paths:
  cam_001: {}
  cam_002: {}
  cam_003: {}
  cam_004: {}
  cam_005: {}
  cam_006: {}
  cam_007: {}
  cam_008: {}
  cam_009: {}
  cam_010: {}
  cam_011: {}
  cam_012: {}
  cam_013: {}
  cam_014: {}
  cam_015: {}
  cam_016: {}
  # Local USB/V4L2 development publisher. Not an Appliance source contract.
  cam_usb_lab: {}
