version: '3.8'

services:
  ksi-cctv:
    build: .
    container_name: ksi-cctv
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - TZ=Asia/Seoul
      - CUDA_VISIBLE_DEVICES=0
      - CCTV_CAM_001_URL=${CCTV_CAM_001_URL:-}
      - CCTV_CAM_002_URL=${CCTV_CAM_002_URL:-}
      - CCTV_CAM_003_URL=${CCTV_CAM_003_URL:-}
      - KSI_CCTV_DASHBOARD_PASSWORD=${KSI_CCTV_DASHBOARD_PASSWORD:-change-me}
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - cctv-network

networks:
  cctv-network:
    driver: bridge
