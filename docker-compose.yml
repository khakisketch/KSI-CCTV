version: '3.8'

# 기본 `docker compose up`은 무인 탐지 데몬(ksi-cctv)만 실행한다(24시간 탐지·알람·헬스).
# 운영자 대시보드는 옵션이다: `docker compose --profile dashboard up` 으로 함께 띄운다.

x-common: &common
  build: .
  volumes:
    # 런타임 모델 업로드 기능이 config/model_profiles.yaml과 models/uploaded/에 쓰므로 rw 필요.
    - ./config:/app/config
    - ./models:/app/models
    - ./logs:/app/logs
    - ./data:/app/data
  environment: &common-env
    PYTHONUNBUFFERED: "1"
    LOG_LEVEL: INFO
    TZ: Asia/Seoul
    CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    CCTV_CAM_001_URL: ${CCTV_CAM_001_URL:-}
    CCTV_CAM_002_URL: ${CCTV_CAM_002_URL:-}
    CCTV_CAM_003_URL: ${CCTV_CAM_003_URL:-}
  restart: unless-stopped
  networks:
    - cctv-network

services:
  # ── 무인 탐지 데몬(기본 서비스) ──────────────────────────────────────────────
  ksi-cctv:
    <<: *common
    container_name: ksi-cctv
    environment:
      <<: *common-env
      KSI_CCTV_MODE: daemon   # src/run.py 데몬 — 파이프라인 자동 기동 + /health(8081)
    ports:
      # 외부 모니터링/오케스트레이터가 헬스 프로브할 수 있도록 8081 노출
      - "8081:8081"
    # GPU 설정(Compose Spec 표준). CPU-only 배포는 이 deploy 블록을 주석 처리.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # 런타임 liveness — /health/live(프로세스 생존 시 항상 200). /health는 카메라 stale 등에서
    # 503이라 컨테이너 재시작 루프를 유발하므로 liveness 프로브로 부적합(준비도는 /health/ready).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── 운영자 대시보드(옵션: --profile dashboard) ───────────────────────────────
  ksi-cctv-dashboard:
    <<: *common
    container_name: ksi-cctv-dashboard
    profiles: ["dashboard"]
    environment:
      <<: *common-env
      KSI_CCTV_MODE: dashboard
      # 비밀번호 강제는 entrypoint 가드(change-me/빈값 거부)에 일임한다. 여기서 `:?`(required)로 두면
      # 비활성 profile임에도 보간이 먼저 평가돼 'docker compose up'(daemon만)까지 실패하므로 기본값을 둔다.
      KSI_CCTV_DASHBOARD_PASSWORD: ${KSI_CCTV_DASHBOARD_PASSWORD:-change-me}
    ports:
      - "8080:8080"
    # 대시보드는 streamlit(8080)만 띄우고 8081 health 서버를 안 띄우므로, 이미지 HEALTHCHECK(8081)를
    # streamlit liveness(8080)로 override한다(미override 시 컨테이너가 영구 unhealthy).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  cctv-network:
    driver: bridge
