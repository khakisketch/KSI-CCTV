version: '3.8'

services:
  ksi-cctv:
    build: .
    container_name: ksi-cctv
    ports:
      - "8080:8080"
    volumes:
      # 런타임 모델 업로드 기능이 config/model_profiles.yaml과 models/uploaded/에 쓰므로 rw 필요.
      # (업로드 기능을 쓰지 않는 배포에서는 :ro로 되돌려 하드닝 가능)
      - ./config:/app/config
      - ./models:/app/models
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - TZ=Asia/Seoul
      - CUDA_VISIBLE_DEVICES=0
      - CCTV_CAM_001_URL=${CCTV_CAM_001_URL:-}
      - CCTV_CAM_002_URL=${CCTV_CAM_002_URL:-}
      - CCTV_CAM_003_URL=${CCTV_CAM_003_URL:-}
      - KSI_CCTV_DASHBOARD_PASSWORD=${KSI_CCTV_DASHBOARD_PASSWORD:-change-me}
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - cctv-network

networks:
  cctv-network:
    driver: bridge
