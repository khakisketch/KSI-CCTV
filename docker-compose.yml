# 기본 `docker compose up`은 무인 탐지 데몬(ksi-cctv)만 실행한다(24시간 탐지·알람·헬스).
# 운영자 대시보드는 옵션이다: `docker compose --profile dashboard up` 으로 함께 띄운다.

x-common: &common
  build: .
  volumes:
    # 런타임 모델 업로드 기능이 config/model_profiles.yaml과 models/uploaded/에 쓰므로 rw 필요.
    - ./config:/app/config
    - ./models:/app/models
    - ./logs:/app/logs
    - ./data:/app/data
  environment: &common-env
    PYTHONUNBUFFERED: "1"
    LOG_LEVEL: INFO
    TZ: Asia/Seoul
    CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    CCTV_CAM_001_URL: ${CCTV_CAM_001_URL:-}
    CCTV_CAM_002_URL: ${CCTV_CAM_002_URL:-}
    CCTV_CAM_003_URL: ${CCTV_CAM_003_URL:-}
    # 엔진 API(/api/*) 인증 키. 미설정이면 fail-closed(503)로 /api 차단(/health/live는 무인증 200 유지).
    # 웹 UI(--profile web) 사용 시 반드시 .env에 설정하고 ksi-cctv-web과 동일 값을 공유해야 한다.
    KSI_CCTV_API_KEY: ${KSI_CCTV_API_KEY:-}
  restart: unless-stopped
  # 24/7 무인 운영 시 컨테이너 stdout(PYTHONUNBUFFERED=1로 INFO 전량)이 기본 json-file 드라이버에
  # 무한 축적되어 디스크를 채운다 → 로그 로테이션으로 상한(앱 내부 alerts.log는 RotatingFileHandler 별도).
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  networks:
    - cctv-network

services:
  # ── 무인 탐지 데몬(기본 서비스) ──────────────────────────────────────────────
  ksi-cctv:
    <<: *common
    container_name: ksi-cctv
    environment:
      <<: *common-env
      KSI_CCTV_MODE: daemon   # src/run.py 데몬 — 파이프라인 자동 기동 + 엔진 API/헬스(8081)
      # 기본 0.0.0.0 바인드 — 단, 아래 ports에 8081을 매핑하지 않으므로 호스트/외부에는 노출되지
      # 않고 compose 네트워크(ksi-cctv-web 등 형제 컨테이너)에서만 도달 가능하다(/api는 키 인증).
      # 호스트로도 8081을 열려면 ports에 "127.0.0.1:8081:8081"을 추가한다(외부 0.0.0.0 매핑은 지양).
      KSI_CCTV_HEALTH_HOST: ${KSI_CCTV_HEALTH_HOST:-0.0.0.0}
    # 헬스/API 포트(8081)는 호스트에 매핑하지 않는다(/health 운영상태 정보 보호). 필요 시 명시 opt-in.
    # GPU 설정(Compose Spec 표준). CPU-only 배포는 이 deploy 블록을 주석 처리.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # 런타임 liveness — /health/live(프로세스 생존 시 항상 200). /health는 카메라 stale 등에서
    # 503이라 컨테이너 재시작 루프를 유발하므로 liveness 프로브로 부적합(준비도는 /health/ready).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── 운영자 대시보드(옵션: --profile dashboard) ───────────────────────────────
  ksi-cctv-dashboard:
    <<: *common
    container_name: ksi-cctv-dashboard
    profiles: ["dashboard"]
    environment:
      <<: *common-env
      KSI_CCTV_MODE: dashboard
      # 비밀번호 강제는 entrypoint 가드(change-me/빈값 거부)에 일임한다. 여기서 `:?`(required)로 두면
      # 비활성 profile임에도 보간이 먼저 평가돼 'docker compose up'(daemon만)까지 실패하므로 기본값을 둔다.
      KSI_CCTV_DASHBOARD_PASSWORD: ${KSI_CCTV_DASHBOARD_PASSWORD:-change-me}
    ports:
      - "8080:8080"
    # 대시보드는 streamlit(8080)만 띄우고 8081 health 서버를 안 띄우므로, 이미지 HEALTHCHECK(8081)를
    # streamlit liveness(8080)로 override한다(미override 시 컨테이너가 영구 unhealthy).
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── 웹 UI(옵션: --profile web) — Next.js 관제 콘솔/모바일 뷰어 ─────────────────
  # 엔진 API(ksi-cctv:8081)를 서버사이드로 호출한다(API 키는 브라우저 미노출). Streamlit 대시보드를
  # 대체하는 신규 UI다. 기동: KSI_CCTV_API_KEY/KSI_CCTV_WEB_PASSWORD를 .env에 설정 후
  #   docker compose --profile web up --build
  ksi-cctv-web:
    build: ./frontend
    container_name: ksi-cctv-web
    profiles: ["web"]
    depends_on:
      ksi-cctv:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      # 같은 compose 네트워크의 엔진 데몬을 서비스명으로 호출(호스트 포트 매핑 불필요).
      KSI_CCTV_ENGINE_URL: ${KSI_CCTV_ENGINE_URL:-http://ksi-cctv:8081}
      # 엔진과 동일한 API 키여야 /api 호출이 인증된다(미설정 시 엔진이 503 → UI는 "미연결"로 graceful).
      KSI_CCTV_API_KEY: ${KSI_CCTV_API_KEY:-}
      # 프론트 로그인 비밀번호(미설정/change-me면 fail-closed로 접근 차단).
      KSI_CCTV_WEB_PASSWORD: ${KSI_CCTV_WEB_PASSWORD:-}
      # 세션 서명 시크릿(미설정 시 WEB_PASSWORD에서 파생 — 별도 강력한 값 권장).
      KSI_CCTV_WEB_SECRET: ${KSI_CCTV_WEB_SECRET:-}
    ports:
      - "3000:3000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - cctv-network
    # Next standalone(node server.js)는 alpine에 curl이 없으므로 node로 직접 프로브한다.
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  cctv-network:
    driver: bridge
