version: '3.8'

services:
  ksi-cctv:
    build: .
    container_name: ksi-cctv
    ports:
      - "8080:8080"
      # 외부 모니터링/오케스트레이터가 헬스 프로브할 수 있도록 8081 노출
      - "8081:8081"
    volumes:
      # 런타임 모델 업로드 기능이 config/model_profiles.yaml과 models/uploaded/에 쓰므로 rw 필요.
      # (업로드 기능을 쓰지 않는 배포에서는 :ro로 되돌려 하드닝 가능)
      - ./config:/app/config
      - ./models:/app/models
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - TZ=Asia/Seoul
      # DGX Spark GPU 인덱스 (GPU 없으면 CUDA_VISIBLE_DEVICES="" 또는 미설정)
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - CCTV_CAM_001_URL=${CCTV_CAM_001_URL:-}
      - CCTV_CAM_002_URL=${CCTV_CAM_002_URL:-}
      - CCTV_CAM_003_URL=${CCTV_CAM_003_URL:-}
      # 비밀번호 미설정(change-me) 시 엔트리포인트에서 거부됨. .env 필수.
      - KSI_CCTV_DASHBOARD_PASSWORD=${KSI_CCTV_DASHBOARD_PASSWORD:?대시보드 비밀번호(KSI_CCTV_DASHBOARD_PASSWORD)를 .env에 설정하세요}
    # GPU 설정: deploy.resources 방식(Compose Spec 표준)으로 단일화.
    # runtime: nvidia(구형)는 제거 — NVIDIA Container Toolkit이 없으면 즉시 실패하기 때문.
    # CPU-only 배포: 아래 deploy 블록 전체를 주석 처리하거나 docker-compose.cpu.yml 오버라이드 사용.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # compose 레벨 healthcheck: 컨테이너 상태 표시 및 의존 서비스 제어에 사용
    # 런타임 liveness 엔드포인트(src/utils/health.py)를 확인
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - cctv-network

networks:
  cctv-network:
    driver: bridge
