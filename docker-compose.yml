version: '3.8'

# 기본 `docker compose up`은 무인 탐지 데몬(ksi-cctv)만 실행한다(24시간 탐지·알람·헬스).
# 운영자 대시보드는 옵션이다: `docker compose --profile dashboard up` 으로 함께 띄운다.

x-common: &common
  build: .
  volumes:
    # 런타임 모델 업로드 기능이 config/model_profiles.yaml과 models/uploaded/에 쓰므로 rw 필요.
    - ./config:/app/config
    - ./models:/app/models
    - ./logs:/app/logs
    - ./data:/app/data
  environment: &common-env
    PYTHONUNBUFFERED: "1"
    LOG_LEVEL: INFO
    TZ: Asia/Seoul
    CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
    CCTV_CAM_001_URL: ${CCTV_CAM_001_URL:-}
    CCTV_CAM_002_URL: ${CCTV_CAM_002_URL:-}
    CCTV_CAM_003_URL: ${CCTV_CAM_003_URL:-}
  restart: unless-stopped
  networks:
    - cctv-network

services:
  # ── 무인 탐지 데몬(기본 서비스) ──────────────────────────────────────────────
  ksi-cctv:
    <<: *common
    container_name: ksi-cctv
    environment:
      <<: *common-env
      KSI_CCTV_MODE: daemon   # src/run.py 데몬 — 파이프라인 자동 기동 + /health(8081)
    ports:
      # 외부 모니터링/오케스트레이터가 헬스 프로브할 수 있도록 8081 노출
      - "8081:8081"
    # GPU 설정(Compose Spec 표준). CPU-only 배포는 이 deploy 블록을 주석 처리.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # 런타임 liveness — src/run.py가 등록한 pipeline-aware /health(카메라/모델/VLM 포함) 확인
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ── 운영자 대시보드(옵션: --profile dashboard) ───────────────────────────────
  ksi-cctv-dashboard:
    <<: *common
    container_name: ksi-cctv-dashboard
    profiles: ["dashboard"]
    environment:
      <<: *common-env
      KSI_CCTV_MODE: dashboard
      # 대시보드는 비밀번호 필수(미설정/change-me 시 엔트리포인트가 거부).
      KSI_CCTV_DASHBOARD_PASSWORD: ${KSI_CCTV_DASHBOARD_PASSWORD:?대시보드 비밀번호(KSI_CCTV_DASHBOARD_PASSWORD)를 .env에 설정하세요}
    ports:
      - "8080:8080"

networks:
  cctv-network:
    driver: bridge
